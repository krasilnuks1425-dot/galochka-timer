<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1114" />
    <meta
      name="description"
      content="Таймер відпочинку між підходами в тренажерному залі"
    />
    <title>Відпочинок між підходами</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">Тренажерний зал</p>
        <h1>Відпочинок між підходами</h1>
      </header>

      <section class="set-row" aria-label="Лічильник підходів">
        <div>
          <p class="label">Підхід</p>
          <p class="set-number" id="set-number">1</p>
        </div>
        <button type="button" class="ghost" id="reset-sets">
          Скинути підходи
        </button>
      </section>

      <section class="clock-card" aria-live="polite">
        <div class="ring" id="ring">
          <div class="ring-inner">
            <p class="status" id="status">Готовий</p>
            <p class="clock" id="clock">1:30</p>
            <p class="hint" id="hint">Натисни старт після підходу</p>
          </div>
        </div>
      </section>

      <section class="presets" aria-label="Тривалість відпочинку">
        <button type="button" class="preset" data-seconds="30">30 с</button>
        <button type="button" class="preset" data-seconds="45">45 с</button>
        <button type="button" class="preset" data-seconds="60">60 с</button>
        <button type="button" class="preset is-active" data-seconds="90">
          90 с
        </button>
        <button type="button" class="preset" data-seconds="120">2 хв</button>
        <button type="button" class="preset" data-seconds="180">3 хв</button>
      </section>

      <section class="nudge" aria-label="Коригування часу">
        <button type="button" id="minus-15">−15 с</button>
        <button type="button" id="plus-15">+15 с</button>
      </section>

      <section class="actions">
        <button type="button" class="primary" id="toggle">Старт</button>
        <button type="button" class="secondary" id="skip" disabled>
          Пропустити
        </button>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
